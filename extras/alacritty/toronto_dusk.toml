# Toronto Dusk theme for Alacritty
# https://github.com/your-username/toronto.nvim

[colors.primary]
background = "#161719"
foreground = "#d1cfc8"
dim_foreground = "#929089"

[colors.cursor]
text = "#161719"
cursor = "#d1cfc8"

[colors.vi_mode_cursor]
text = "#161719"
cursor = "#c6aa64"

[colors.selection]
text = "CellForeground"
background = "#2b2c32"

[colors.search.matches]
foreground = "#161719"
background = "#c6aa64"

[colors.search.focused_match]
foreground = "#161719"
background = "#cdb073"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#d1cfc8"
background = "#1d1e21"

[colors.normal]
black = "#161719"
red = "#c37b7c"
green = "#acbbaf"
yellow = "#cdb073"
blue = "#86adb0"
magenta = "#b99eb2"
cyan = "#9ebab6"
white = "#d1cfc8"

[colors.bright]
black = "#5b5a56"
red = "#dc9999"
green = "#c9d5ca"
yellow = "#e6cb91"
blue = "#a8cbcf"
magenta = "#d3bacb"
cyan = "#bfdbd4"
white = "#e3e0d8"
