# Toronto Dusk theme for Alacritty
# https://github.com/your-username/toronto.nvim

[colors.primary]
background = "#08090b"
foreground = "#d4d2cb"
dim_foreground = "#94918a"

[colors.cursor]
text = "#08090b"
cursor = "#d4d2cb"

[colors.vi_mode_cursor]
text = "#08090b"
cursor = "#d2b56f"

[colors.selection]
text = "CellForeground"
background = "#1c1d22"

[colors.search.matches]
foreground = "#08090b"
background = "#d2b56f"

[colors.search.focused_match]
foreground = "#08090b"
background = "#d9bc7e"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#d4d2cb"
background = "#0d0e11"

[colors.normal]
black = "#08090b"
red = "#ce8585"
green = "#b8c7bb"
yellow = "#d9bc7e"
blue = "#91b8bc"
magenta = "#c4a9bd"
cyan = "#a9c5c1"
white = "#d4d2cb"

[colors.bright]
black = "#5b5a56"
red = "#dc9999"
green = "#c9d5ca"
yellow = "#e6cb91"
blue = "#a8cbcf"
magenta = "#d3bacb"
cyan = "#bfdbd4"
white = "#e3e0d8"
