# Toronto Dusk theme for Alacritty
# https://github.com/your-username/toronto.nvim

[colors.primary]
background = "#000000"
foreground = "#f6f6f6"
dim_foreground = "#d0d0e8"

[colors.cursor]
text = "#000000"
cursor = "#f6f6f6"

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#b8860b"

[colors.selection]
text = "CellForeground"
background = "#3f2d4a"

[colors.search.matches]
foreground = "#000000"
background = "#b8860b"

[colors.search.focused_match]
foreground = "#000000"
background = "#7fd2ff"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#f6f6f6"
background = "#0f0f0f"

[colors.normal]
black = "#0f0f0f"
red = "#ff8899"
green = "#32ffe0"
yellow = "#b8860b"
blue = "#7fd2ff"
magenta = "#d98cff"
cyan = "#32ffe0"
white = "#f6f6f6"

[colors.bright]
black = "#0f0f0f"
red = "#ff8899"
green = "#32ffe0"
yellow = "#b8860b"
blue = "#7fd2ff"
magenta = "#d98cff"
cyan = "#32ffe0"
white = "#f6f6f6"
