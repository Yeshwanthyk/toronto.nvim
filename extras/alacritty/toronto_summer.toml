# Toronto Summer theme for Alacritty
# https://github.com/your-username/toronto.nvim

[colors.primary]
background = "#fffaf2"
foreground = "#22160f"
dim_foreground = "#9d816d"

[colors.cursor]
text = "#fffaf2"
cursor = "#22160f"

[colors.vi_mode_cursor]
text = "#fffaf2"
cursor = "#ff9f1c"

[colors.selection]
text = "CellForeground"
background = "#ffd9c6"

[colors.search.matches]
foreground = "#fffaf2"
background = "#ff9f1c"

[colors.search.focused_match]
foreground = "#fffaf2"
background = "#ff9f1c"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#22160f"
background = "#fff6e8"

[colors.normal]
black = "#f8ead7"
red = "#ff5c8f"
green = "#2ca7a2"
yellow = "#ff9f1c"
blue = "#8b6dff"
magenta = "#ff5c8f"
cyan = "#2ca7a2"
white = "#22160f"

[colors.bright]
black = "#ffd9c6"
red = "#ff77a5"
green = "#40beb9"
yellow = "#ffb84a"
blue = "#a284ff"
magenta = "#ff77a5"
cyan = "#40beb9"
white = "#463024"
