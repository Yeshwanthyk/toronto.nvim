# Toronto Spring theme for Alacritty
# https://github.com/your-username/toronto.nvim

[colors.primary]
background = "#15171b"
foreground = "#cbcfd6"
dim_foreground = "#89919b"

[colors.cursor]
text = "#15171b"
cursor = "#cbcfd6"

[colors.vi_mode_cursor]
text = "#15171b"
cursor = "#bea66d"

[colors.selection]
text = "CellForeground"
background = "#262d3a"

[colors.search.matches]
foreground = "#15171b"
background = "#bea66d"

[colors.search.focused_match]
foreground = "#15171b"
background = "#96b4c4"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#cbcfd6"
background = "#1a1d24"

[colors.normal]
black = "#15171b"
red = "#c08581"
green = "#97b69f"
yellow = "#bea66d"
blue = "#8eadc2"
magenta = "#c19992"
cyan = "#82a8b7"
white = "#cbcfd6"

[colors.bright]
black = "#5c6470"
red = "#dfa9a5"
green = "#bdd8c3"
yellow = "#dfc994"
blue = "#b4d0e2"
magenta = "#e0c0b8"
cyan = "#acd0dc"
white = "#e0e4ea"
