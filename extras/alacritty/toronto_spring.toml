# Toronto Spring theme for Alacritty
# https://github.com/your-username/toronto.nvim

[colors.primary]
background = "#090b0f"
foreground = "#d0d5dc"
dim_foreground = "#929aa5"

[colors.cursor]
text = "#090b0f"
cursor = "#d0d5dc"

[colors.vi_mode_cursor]
text = "#090b0f"
cursor = "#d0b77e"

[colors.selection]
text = "CellForeground"
background = "#1b2330"

[colors.search.matches]
foreground = "#090b0f"
background = "#d0b77e"

[colors.search.focused_match]
foreground = "#090b0f"
background = "#a8c6d6"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#d0d5dc"
background = "#0e1117"

[colors.normal]
black = "#090b0f"
red = "#d19591"
green = "#a9c9b1"
yellow = "#d0b77e"
blue = "#9fbfd4"
magenta = "#d2aaa3"
cyan = "#93bac9"
white = "#d0d5dc"

[colors.bright]
black = "#5c6470"
red = "#dfa9a5"
green = "#bdd8c3"
yellow = "#dfc994"
blue = "#b4d0e2"
magenta = "#e0c0b8"
cyan = "#acd0dc"
white = "#e0e4ea"
