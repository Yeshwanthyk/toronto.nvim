# Toronto Dawn theme for Alacritty
# https://github.com/your-username/toronto.nvim

[colors.primary]
background = "#edece9"
foreground = "#2f2722"
dim_foreground = "#686059"

[colors.cursor]
text = "#edece9"
cursor = "#2f2722"

[colors.vi_mode_cursor]
text = "#edece9"
cursor = "#714b00"

[colors.selection]
text = "CellForeground"
background = "#d6cec2"

[colors.search.matches]
foreground = "#edece9"
background = "#714b00"

[colors.search.focused_match]
foreground = "#edece9"
background = "#893e00"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#2f2722"
background = "#e7e4df"

[colors.normal]
black = "#2f2722"
red = "#c84848"
green = "#2898a8"
yellow = "#c06820"
blue = "#6080a0"
magenta = "#9858a8"
cyan = "#38a8b8"
white = "#c6beb2"

[colors.bright]
black = "#4c443d"
red = "#d85858"
green = "#38a8b8"
yellow = "#d07830"
blue = "#7090b0"
magenta = "#a868b8"
cyan = "#48b8c8"
white = "#edece9"
